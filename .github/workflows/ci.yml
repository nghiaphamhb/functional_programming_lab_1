name: OCaml CI - Euler 13

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup OCaml
        uses: avsm/setup-ocaml@v4
        with:
          ocaml-compiler: '4.14.0'
          dune-cache: true

      - name: Install tools (dune, ocamlformat, ounit2)
        run: |
          opam install -y dune ocamlformat ounit2

      - name: Format check
        working-directory: euler_13
        run: |
          ocamlformat --version
          ocamlformat --check $(git ls-files '*.ml' '*.mli')

      - name: Build
        working-directory: euler_13
        run: |
          dune build

      - name: Run tests (optional)
        working-directory: euler_13
        run: |
          dune runtest
