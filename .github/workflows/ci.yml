name: OCaml CI - Euler 13

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup OCaml + opam (không dùng sudo, fix lỗi input cũ)
      - name: Setup OCaml
        uses: avsm/setup-ocaml@v2
        with:
          ocaml-compiler: "4.14.0"
          opam-repositories: default
          opam-disable-sandboxing: true

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          eval $(opam env)
          opam install dune ocamlformat ounit2 -y

      # 4️⃣ Format check Euler 13
      - name: Format check
        run: |
          eval $(opam env)
          cd euler_13
          ocamlformat --check $(find . -path ./_build -prune -o -type f \( -name "*.ml" -o -name "*.mli" \) -print)

      # 5️⃣ Build Euler 13
      - name: Build project
        run: |
          eval $(opam env)
          cd euler_13
          dune build @all

      # 6️⃣ Run tests Euler 13
      - name: Run tests
        run: |
          eval $(opam env)
          cd euler_13/test
          dune exec ./test_euler_13.exe
