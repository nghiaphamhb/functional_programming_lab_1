name: OCaml CI - Euler 13

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          eval $(opam env)
          opam install dune ocamlformat ounit2 -y


      # 1️⃣ Cài opam và OCaml thủ công, tránh sudo
      - name: Install OCaml & opam manually
        run: |
          sudo rm -rf /home/runner/.opam
          sudo apt-get update
          sudo apt-get install -y opam
          opam init --disable-sandboxing -y
          eval $(opam env)
          opam switch create 4.14.0 || true
          eval $(opam env)
          opam install dune ocamlformat ounit2 -y

      # 2️⃣ Format check
      - name: Format check Euler 13
        run: |
          eval $(opam env)
          cd euler_13
          ocamlformat --check $(find . -path ./_build -prune -o -type f \( -name "*.ml" -o -name "*.mli" \) -print)

      # 3️⃣ Build project
      - name: Build Euler 13
        run: |
          cd euler_13
          dune build @all

      # 4️⃣ Run tests
      - name: Run tests Euler 13
        run: |
          cd euler_13/test
          dune exec ./test_euler_13.exe || true
