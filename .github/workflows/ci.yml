name: OCaml CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup OCaml
        uses: avsm/setup-ocaml@v2
        with:
          ocaml-compiler: "4.14.0"
          opam-repositories: default
          opam-disable-sandboxing: true

      - name: Install dependencies
        run: |
          eval $(opam env)
          opam install dune ocamlformat ounit2 -y

      - name: Format check
        run: |
          cd euler_13
          ocamlformat --check $(find . -path ./_build -prune -o -type f \( -name "*.ml" -o -name "*.mli" \) -print)

      - name: Build project
        run: |
          cd euler_13
          dune build @all

      - name: Run tests
        run: |
          cd euler_13/test
          dune exec ./test_euler_13.exe || true
