name: OCaml CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup OCaml và opam
      - name: Setup OCaml
        uses: avsm/setup-ocaml@v2
        with:
          ocaml-compiler: "4.14.0"          # phiên bản OCaml
          opam-repositories: default        # repo opam
          opam-disable-sandboxing: true     # tránh lỗi sudo

      # 3️⃣ Cài dependencies
      - name: Install dependencies
        run: |
          eval $(opam env)
          opam install dune ocamlformat ounit2 -y

      # 4️⃣ Format check (Euler 13)
      - name: Format check Euler 13
        run: |
          cd euler_13
          ocamlformat --check $(find . -path ./_build -prune -o -type f \( -name "*.ml" -o -name "*.mli" \) -print)

      # 5️⃣ Build project (Euler 13)
      - name: Build Euler 13
        run: |
          cd euler_13
          dune build @all

      # 6️⃣ Run tests (Euler 13)
      - name: Run tests Euler 13
        run: |
          cd euler_13/test
          dune exec ./test_euler_13.exe || true

      # 7️⃣ Format check (Euler 17)
      - name: Format check Euler 17
        run: |
          cd euler_17
          ocamlformat --check $(find . -path ./_build -prune -o -type f \( -name "*.ml" -o -name "*.mli" \) -print)

      # 8️⃣ Build project (Euler 17)
      - name: Build Euler 17
        run: |
          cd euler_17
          dune build @all

      # 9️⃣ Run tests (Euler 17)
      - name: Run tests Euler 17
        run: |
          cd euler_17/test
          dune exec ./test_euler_17.exe || true
