name: OCaml CI - Euler 13

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14.0'
          dune-cache: true

      # Zarith cần GMP ở runner
      - name: Install system deps for zarith (GMP)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev

      # Cài tất cả tool cần thiết (không có opam-dune-lint)
      - name: Install tools
        run: |
          opam install -y dune ocamlformat ounit2 zarith ocaml-lint

      # 🧹 Lint code OCaml
      - name: OCaml Lint
        working-directory: euler_13
        run: |
          eval $(opam env)
          echo "Running ocaml-lint..."
          ocaml-lint $(find . -name '*.ml' -o -name '*.mli')

      # 🧾 Lint metadata .opam
      - name: Lint opam files
        working-directory: euler_13
        run: |
          eval $(opam env)
          opam lint .

      # 🎨 Kiểm tra định dạng code
      - name: Format check
        working-directory: euler_13
        run: |
          eval $(opam env)
          ocamlformat --version
          ocamlformat --check $(git ls-files '*.ml' '*.mli')

      # 🏗️ Build project
      - name: Build
        working-directory: euler_13
        run: |
          eval $(opam env)
          dune build

      # 🧾 Run tests
      - name: Run tests
        working-directory: euler_13
        run: |
          eval $(opam env)
          dune runtest
