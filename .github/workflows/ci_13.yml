name: OCaml CI - Euler 13

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest  # virtual machine latest version ubuntu 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # version 5 of action actions/checkout from GitHub Marketplace : clone repository into here
        # users : reuse action available
        
      - name: Setup OCaml environment
        uses: ocaml/setup-ocaml@v3 # from GitHub Marketplace (by OCaml community)
        with:
          ocaml-compiler: '4.14.0' # version compiler 
          dune-cache: true # dune has cache for saving compiled files

      - name: Install system dependency for zarith (GMP)
        run: | # run : run shell command / '|' after that is multi-line string
          sudo apt-get update
          sudo apt-get install -y libgmp-dev

      - name: Install OCaml tools and libraries
        run: |
          opam install -y dune ocamlformat.0.27.0 ounit2 zarith

      - name: OCaml Lint (compiler warnings) #reset the OPAM environment variable
        working-directory: euler_13 # default: $GITHUB_WORKSPACE
        run: |
          eval $(opam env) 
          echo "Running lint (compiler warnings)..."
          dune build --profile dev
        # compile project in dev mode (Keep debug info; 
        # Display warning compiler (warnings); 
        # Not optimized code (faster when building CI))
        
      - name: Lint opam files
        working-directory: euler_13
        run: |
          eval $(opam env)
          opam lint .
        # check syntax and structure file opam
        
      - name: Format check
        working-directory: euler_13
        run: |
          eval $(opam env)
          echo "Checking code formatting..."
          ocamlformat --version
          files="$(git ls-files -- '*.ml' '*.mli')"
          if [ -z "$files" ]; then
            echo "No OCaml files to format."
            exit 0
          fi
          failed=0
          for f in $files; do
            if ! ocamlformat --check "$f"; then
              echo "Not formatted: $f"
              failed=1
            fi
          done
          exit $failed


      - name: Build project
        working-directory: euler_13
        run: |
          eval $(opam env)
          dune build

      - name: Run tests
        working-directory: euler_13
        run: |
          eval $(opam env)
          dune runtest
        # test file *.ml in test/dune 
