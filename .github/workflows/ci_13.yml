name: OCaml CI - Euler 13

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup OCaml environment
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14.0'
          dune-cache: true

      - name: Install system dependency for zarith (GMP)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev

      - name: Install OCaml tools and libraries
        run: |
          opam install -y dune ocamlformat ounit2 zarith

      - name: OCaml Lint (compiler warnings)
        working-directory: euler_13
        run: |
          eval $(opam env)
          echo "Running lint (compiler warnings)..."
          dune build --profile dev

      - name: Lint opam files
        working-directory: euler_13
        run: |
          eval $(opam env)
          opam lint .

      - name: Format check
        working-directory: euler_13
        run: |
          eval $(opam env)
          echo "Checking code formatting..."
          ocamlformat --version
          files="$(git ls-files -- '*.ml' '*.mli')"
          if [ -z "$files" ]; then
            echo "No OCaml files to format."
            exit 0
          fi
          failed=0
          for f in $files; do
            if ! ocamlformat --check "$f"; then
              echo "Not formatted: $f"
              failed=1
            fi
          done
          exit $failed


      - name: Build project
        working-directory: euler_13
        run: |
          eval $(opam env)
          dune build

      - name: Run tests
        working-directory: euler_13
        run: |
          eval $(opam env)
          dune runtest
